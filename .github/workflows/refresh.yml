name: Refresh

# The second entry point: `code/refresh.py`, re-assessing what this cache already recorded against
# whatever NWB Inspector release the current image carries. Everything but the schedule and the
# dispatch inputs is the same shared action the update runs, told which operation to run.

permissions:
  contents: read
  packages: read

on:
  schedule:
    - cron: "0 12 * * *"  # Daily at 12:00 UTC.
  workflow_dispatch:
    inputs:
      testing:
        description: "Testing mode: re-assess a handful of items into testing_-prefixed files, leaving the real cache untouched."
        required: false
        type: boolean
        default: false
      limit:
        description: >-
          Cap on the content IDs re-assessed this run. Leave empty for the default of about 1/30th
          of the cache, so a daily run cycles through the whole of it roughly once a month. Set it
          to the full cache size for a one-off complete re-assessment.
        required: false
        type: string
        default: ""

# Shared with Update: both write the same three derivatives files and push the same branches, so
# they must never run at once. See update.yml for the full rationale.
concurrency:
  group: dandi-cache-pipeline
  cancel-in-progress: false

jobs:
  Refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # So a hung network read cannot burn a full six hours.
    timeout-minutes: 330
    steps:
      - uses: dandi-cache/dandi-cache-action@v2
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          operation: refresh
          testing: ${{ inputs.testing || false }}
          limit: ${{ inputs.limit || '' }}
          mail-username: ${{ secrets.MAIL_USERNAME }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
