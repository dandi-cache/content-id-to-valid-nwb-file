name: Build and Upload Container

# The build itself -- tagging per ref so a branch build no longer overwrites `:latest`, the
# registry login, and the check that the image really did come from the shared base -- is in the
# shared action.

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main ]
    paths:
      - "envs/pyproject.toml"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  pull_request:
    paths:
      - "envs/pyproject.toml"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  schedule:
    # Monthly on the 1st, as a floor under the dispatch below. Nothing is version-pinned in the base
    # image, so a rebuild picks up newer NWB Inspector (and dandi, pynwb, etc.) releases even when
    # nothing here has changed, and the Refresh workflow then re-assesses the cache against them.
    # The base rebuilds monthly too and asks for this one, so in the ordinary case this fires on an
    # image that is already current; it is here so that a broken fan-out cannot leave this cache
    # validating against a year-old inspector without anyone noticing.
    - cron: "0 5 1 * *"
  repository_dispatch:
    # Sent by dandi-cache-utils when it publishes a new base image. This image is built `FROM` that
    # base and `FROM` resolves at build time, so without this the cache would keep whatever base it
    # was last built on until its own Dockerfile or dependencies happened to change.
    types: [ base-image-published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildAndPush:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: dandi-cache/dandi-cache-action/build-and-publish-image@v3
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          mail-username: ${{ secrets.MAIL_USERNAME }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
