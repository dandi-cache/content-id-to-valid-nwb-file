name: Update

# What stays here is what is genuinely this cache's own: when it runs, and what a manual dispatch
# can change. The gate against redundant queued runs, the runner's environment, the registry login,
# the image, the pipeline and the failure notification are all in the shared action.

permissions:
  contents: read
  packages: read

on:
  schedule:
    # Every four hours from 02:41 UTC. A run of the cache.toml limit takes about three hours, so
    # each one is done before the next is due, and the hour of slack absorbs the daily Refresh
    # queued between them. A tighter cadence would queue a third run behind two, and GitHub
    # cancels a pending run in a concurrency group when another one arrives. Off the hour, because
    # GitHub delays and drops scheduled runs that fall on it: on the hour, this cache's runs
    # started three and a half to five and a half hours late.
    - cron: "41 2/4 * * *"
  workflow_dispatch:
    inputs:
      testing:
        description: "Testing mode: process the cache.toml testing_limit of items into testing_-prefixed files, leaving the real cache untouched."
        required: false
        type: boolean
        default: false
      limit:
        description: "Cap on the content IDs assessed this run, overriding the limit in cache.toml. The run still publishes the complete cache; the rest waits for the next one."
        required: false
        type: string
        default: ""

# Serialized with Refresh as well as with itself: both write the same three derivatives files and
# push the same branches, so they must never run at once. An in-progress run is never cancelled,
# and a run triggered while one is executing waits in the queue. The action then skips the queued
# run once it starts, because the update it would perform has just been done.
concurrency:
  group: dandi-cache-pipeline
  cancel-in-progress: false

jobs:
  Update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # So a hung network read cannot burn a full six hours.
    timeout-minutes: 330
    steps:
      - uses: dandi-cache/dandi-cache-action@v4
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          testing: ${{ inputs.testing || false }}
          limit: ${{ inputs.limit || '' }}
          mail-username: ${{ secrets.MAIL_USERNAME }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
