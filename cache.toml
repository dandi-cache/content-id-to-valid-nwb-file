# The complete declarative description of this cache.
#
# One file, read by both the shared orchestration and this cache's own code, so the two cannot
# disagree. It replaces what used to be spread across `code/update_pipeline.sh` (the input
# subdataset URL, path and branch, the output file name, the entry point), the two workflows (the
# image reference, the batch size, the second entry point), `dataset_description.json`, and the
# constants at the top of `code/update.py` and `code/refresh.py`.

[cache]
name = "content-id-to-valid-nwb-file"

# Three files, written together by every run:
#
#   content_id_to_valid_nwb_file  the cache itself, one boolean per content ID
#   content_id_to_checked_at      when each content ID was last assessed, which is what `refresh`
#                                 orders by
#   content_id_to_messages        why a content ID is not valid, for those that are not
#
# Declaring them here is what publishes all three to `dist` and what keeps a `testing_` artifact
# from reaching consumers.
outputs = [
    "content_id_to_valid_nwb_file.jsonl",
    "content_id_to_checked_at.jsonl",
    "content_id_to_messages.jsonl",
]

# Kept on `derivatives` as sixteen files, `content_id_to_messages_0.jsonl` to
# `content_id_to_messages_f.jsonl`, by the first digit of the content ID. Its inspector messages
# passed 100 MiB on 2026-10-07, after which every push of `derivatives` was refused. `dist` still
# publishes it as the one `content_id_to_messages.jsonl.gz`, so no consumer URL changes.
split = ["content_id_to_messages.jsonl"]

# Upstream cache, registered as a DataLad input subdataset and pinned in every run's provenance,
# so each result records the exact input commit it was computed from.
[[inputs]]
name = "content-id-to-nwb-file"

# Streaming a whole NWB file and inspecting it is heavy, so a run advances the backlog by a bounded
# batch rather than trying to clear it. An item costs about 4.4 s on a hosted runner (5 s at the
# slow end), so 1000 is about an hour and a quarter, well inside the job's 330-minute timeout,
# which matters because a run that times out publishes nothing it did.
#
# This was 2500 until a batch of it was killed for memory on 2026-10-09, losing the 2200 results it
# had checkpointed: one process inspecting files grows about 5 MB for each, to 10 GB. Each file is
# now opened and inspected in a child process, which returns all of its memory. The batch stays
# smaller until the first runs show the parent staying flat, because a defect in that isolation
# would record the whole batch as invalid. Raise it again after those runs; six runs a day clear
# 6000 items a day at 1000, and 15000 at 2500.
[operations.update]
limit = 1000
# A testing run streams a whole NWB file and runs the inspector over it, so two is already
# minutes of work and exercises the resolve, the open, the inspection and all three writes.
testing_limit = 2

# The second entry point. The NWB Inspector is a living resource whose checks change over time, so
# what was assessed once has to be assessed again; `code/refresh.py` re-checks the already-recorded
# content IDs, oldest first. Its batch is fixed rather than a share of the cache, since a share
# grows with the cache until a run outlives the job's timeout (a thirtieth of the 230k upstream
# assets is over nine hours). 1500 is about two hours a day, leaving the rest of the day's runner
# time to the update, which other caches are waiting on. It still declares what a smoke run of it
# costs, since `--testing` applies to either entry point.
[operations.refresh]
label = "Refresh"
limit = 1500
testing_limit = 2

# The published branches describe this repository as a BIDS study dataset, through a
# `dataset_description.json` with `DatasetType: "study"`. The pipeline renders that file from this
# section at the start of every run, so the repository no longer carries it.
[description]
authors = ["Cody Baker"]
